name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: durable-runner-dev-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "027660637185"
  ECR_REPOSITORY: durable-runner
  ECS_CLUSTER: durable-runner-dev
  DEPLOY_ROLE_ARN: arn:aws:iam::027660637185:role/durable-runner-dev-github-deploy

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build application
        run: npm run build

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: durable-runner-${{ github.run_id }}

      - name: Set image coordinates
        shell: bash
        run: |
          set -euo pipefail

          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image_uri="${registry}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "REGISTRY=${registry}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${image_uri}" >> "$GITHUB_ENV"

      - name: Check immutable image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail

          set +e
          result="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=${IMAGE_TAG}" \
              --output json \
              --no-cli-pager 2>&1
          )"
          status=$?
          set -e

          if [[ "$status" -eq 0 ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists; reusing immutable Git-SHA tag."
          elif grep -q 'ImageNotFoundException' <<<"$result"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image does not exist yet; it will be built."
          else
            echo "$result" >&2
            exit "$status"
          fi

      - name: Set up QEMU
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ECR
        if: steps.image.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          aws ecr get-login-password \
            --region "$AWS_REGION" |
            docker login \
              --username AWS \
              --password-stdin "$REGISTRY"

      - name: Build and push ARM64 image
        if: steps.image.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE_URI" \
            --push \
            .

      - name: Verify ECR image
        shell: bash
        run: |
          set -euo pipefail

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].{digest:imageDigest,pushedAt:imagePushedAt,tags:imageTags}' \
            --output json \
            --no-cli-pager

      - name: Migrate and deploy ECS services
        run: .github/scripts/deploy-ecs.sh
